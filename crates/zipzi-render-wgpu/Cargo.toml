[package]
name = "zipzi-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# A/B control for pixel validation and GPU measurements; keep disabled in hosts.
benchmark-global-surfaces = []

[dependencies]
bytemuck = { workspace = true }
zipzi-core = { version = "=0.1.0-alpha.5", path = "../zipzi-core" }
zipzi-render = { version = "=0.1.0-alpha.5", path = "../zipzi-render" }
wgpu = { workspace = true }

[dev-dependencies]
png = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
zipzi-render-metal = { version = "=0.1.0-alpha.5", path = "../zipzi-render-metal" }
