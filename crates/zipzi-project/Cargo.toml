[package]
name = "zipzi-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Project persistence, document codec, resource management and publication for Zipzi 2D"

[features]
bench-instrumentation = []

[dependencies]
zipzi-contract.workspace = true
zipzi-project-preview.workspace = true
zipzi-api-derive = { version = "=0.4.0-alpha.1", path = "../zipzi-api-derive" }
zipzi-core = { version = "=0.4.0-alpha.1", path = "../zipzi-core" }
zipzi-live2d = { version = "=0.4.0-alpha.1", path = "../zipzi-live2d" }
zipzi-cmo3 = { version = "=0.4.0-alpha.1", path = "../zipzi-cmo3" }
zipzi-moc3 = { version = "=0.4.0-alpha.1", path = "../zipzi-moc3" }
zipzi-psd = { version = "=0.4.0-alpha.1", path = "../zipzi-psd" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
png = { workspace = true }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bench]]
name = "codec_benchmark"
harness = false
