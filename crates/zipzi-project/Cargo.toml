[package]
name = "zipzi-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Project persistence, document codec, resource management and publication for Zipzi 2D"

[features]
bench-instrumentation = []
binary-prototype = ["dep:ciborium"]

[dependencies]
zipzi-api-derive = { version = "=0.1.0-alpha.3", path = "../zipzi-api-derive" }
zipzi-core = { version = "=0.1.0-alpha.3", path = "../zipzi-core" }
zipzi-live2d = { version = "=0.1.0-alpha.3", path = "../zipzi-live2d" }
zipzi-cmo3 = { version = "=0.1.0-alpha.3", path = "../zipzi-cmo3" }
zipzi-moc3 = { version = "=0.1.0-alpha.3", path = "../zipzi-moc3" }
zipzi-psd = { version = "=0.1.0-alpha.3", path = "../zipzi-psd" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
png = { workspace = true }
uuid = { version = "1", features = ["v4"] }
ciborium = { version = "0.2.2", optional = true }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "project_binary_prototype"
required-features = ["binary-prototype"]

[[bench]]
name = "codec_benchmark"
harness = false
