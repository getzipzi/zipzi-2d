[package]
name = "zipzi-moc3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MOC3 5.0 binary encoder and exporter for Zipzi 2D"

[features]
default = ["purism-validation"]
purism-validation = []

[dependencies]
zipzi-core = { version = "=0.1.0-alpha.4", path = "../zipzi-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
zipzi-project = { version = "=0.1.0-alpha.4", path = "../zipzi-project" }

[[bench]]
name = "moc3_benchmark"
harness = false
