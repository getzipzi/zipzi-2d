[package]
name = "zipzi-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UI-independent host for Zipzi authoring sessions"

[features]
wgpu-backend = ["gpu-observation", "zipzi-observe/wgpu-backend"]
gpu-observation = ["dep:zipzi-observe"]
test-support = []
bench-instrumentation = ["zipzi-project/bench-instrumentation"]

[dependencies]
zipzi-api-derive = { version = "=0.1.0-alpha.3", path = "../zipzi-api-derive" }
zipzi-core.workspace = true
zipzi-sdk.workspace = true
zipzi-project.workspace = true
zipzi-observe = { version = "=0.1.0-alpha.3", path = "../zipzi-observe", optional = true }
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
async-channel.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true
