[package]
name = "zipzi-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UI-independent host for Zipzi authoring sessions"

[features]
wgpu-backend = ["gpu-observation", "zipzi-sdk-observe/wgpu-backend"]
gpu-observation = ["dep:zipzi-sdk-observe"]
test-support = []
bench-instrumentation = ["zipzi-project/bench-instrumentation"]

[dependencies]
zipzi-api-derive = { version = "=0.1.0-alpha.1", path = "../zipzi-api-derive" }
zipzi-core.workspace = true
zipzi-sdk.workspace = true
zipzi-project.workspace = true
zipzi-sdk-observe = { version = "=0.1.0-alpha.1", path = "../zipzi-sdk-observe", optional = true }
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
async-channel.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true
