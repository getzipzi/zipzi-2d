[package]
name = "zipzi-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings for the Zipzi 2D authoring SDK"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
zipzi-core = { version = "=0.1.0-alpha.1", path = "../zipzi-core" }
zipzi-sdk = { version = "=0.1.0-alpha.1", path = "../zipzi-sdk" }
zipzi-moc3 = { version = "=0.1.0-alpha.1", path = "../zipzi-moc3" }
pyo3 = { version = "=0.29.2", features = ["multiple-pymethods"] }
uuid = { version = "1", features = ["v4"] }
serde_json = { workspace = true }
serde = { workspace = true }
zipzi-sdk-observe = { version = "=0.1.0-alpha.1", path = "../zipzi-sdk-observe", optional = true, default-features = false }

[features]
default = ["framework-texture-filtering"]
framework-texture-filtering = ["zipzi-sdk-observe?/framework-texture-filtering"]
observe = ["dep:zipzi-sdk-observe"]
