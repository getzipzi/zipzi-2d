[build-system]
requires = ["maturin==1.15.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "zipzi-native"
dynamic = ["version"]
requires-python = ">=3.14,<3.15"
description = "Optional in-process Runtime backend for zipzi"
dependencies = ["zipzi==0.1.0a1"]
license = "MIT"
license-files = ["LICENSE-MIT", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"

[tool.maturin]
python-source = "native"
module-name = "zipzi_native._native"
bindings = "pyo3"
