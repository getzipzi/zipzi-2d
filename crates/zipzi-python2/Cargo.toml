[package]
name = "zipzi-python2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed Runtime-backed Python SDK native adapter"

[lib]
name = "zipzi_python2_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# Export source contracts without compiling stale generated adapter matches.
schema-export = []
wgpu-backend = ["zipzi-runtime/wgpu-backend"]
test-support = ["zipzi-runtime/test-support"]
bench-instrumentation = ["zipzi-runtime/bench-instrumentation"]

[dependencies]
zipzi-core.workspace = true
zipzi-sdk.workspace = true
zipzi-runtime = { workspace = true, features = ["gpu-observation"] }
pyo3 = { version = "=0.29.2", features = ["multiple-pymethods"] }

serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
