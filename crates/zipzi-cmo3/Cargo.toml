[package]
name = "zipzi-cmo3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Cubism editable project import and export for Zipzi documents"

[features]
test-support = []

[dependencies]
zipzi-core = { version = "=0.1.0-alpha.1", path = "../zipzi-core" }
zipzi-animation = { version = "=0.1.0-alpha.1", path = "../zipzi-animation" }
zipzi-live2d = { version = "=0.1.0-alpha.1", path = "../zipzi-live2d" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
png.workspace = true
roxmltree = "0.20"
flate2 = "1"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
