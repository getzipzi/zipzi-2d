[package]
name = "zipzi-editor-render"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
# Distributed with Editor assets, workspace patches and licenses in the workspace source archive.
publish = false

[features]
wgpu-backend = ["dep:zipzi-render-wgpu", "dep:wgpu"]
bench-instrumentation = ["zipzi-core/bench-instrumentation"]

[dependencies]
anyhow.workspace = true
zipzi-editor-core.workspace = true
zipzi-core.workspace = true
zipzi-render.workspace = true
zipzi-render-metal.workspace = true

zipzi-render-wgpu = { path = "../zipzi-render-wgpu", optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
png.workspace = true
objc2.workspace = true

[[example]]
name = "wgpu_preview"
required-features = ["wgpu-backend"]
