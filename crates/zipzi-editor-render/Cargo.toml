[package]
name = "zipzi-editor-render"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
# Distributed with Editor assets, workspace patches and licenses in the workspace source archive.
publish = false

[features]
wgpu-backend = ["dep:zipzi-render-wgpu", "dep:wgpu"]
bench-instrumentation = ["zipzi-core/bench-instrumentation"]

[dependencies]
anyhow.workspace = true
zipzi-editor-core.workspace = true
zipzi-core.workspace = true
zipzi-render.workspace = true

zipzi-render-wgpu = { version = "=0.1.0-alpha.3", path = "../zipzi-render-wgpu", optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
png.workspace = true

[[example]]
name = "wgpu_preview"
required-features = ["wgpu-backend"]

[[example]]
name = "wgpu_benchmark"
required-features = ["wgpu-backend"]

[[example]]
name = "wgpu_readback_benchmark"
required-features = ["wgpu-backend"]

[target.'cfg(target_os = "macos")'.dependencies]
zipzi-render-metal.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { package = "gpui-fast", version = "0.1.7", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui-windows = { package = "gpui-fast-windows", version = "0.1.7", features = ["test-support"] }
