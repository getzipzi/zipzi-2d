[package]
name = "zipzi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core document model, geometry, deformers and evaluation for Zipzi 2D"

[features]
# Synchronous, thread-local spans for opt-in editor editing benchmarks.
bench-instrumentation = []

[dependencies]
zipzi-api-derive = { version = "=0.1.0-alpha.2", path = "../zipzi-api-derive" }
uuid = { version = "1", features = ["v4"] }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
robust = "1.2.0"
rstar = "0.12.2"

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "eval_benchmark"
harness = false

[[bench]]
name = "production_scale_benchmark"
harness = false
