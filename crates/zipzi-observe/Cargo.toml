[package]
name = "zipzi-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Frozen snapshot capture and GPU observation for Zipzi Runtime"

[features]
default = ["gpu"]
gpu = ["dep:zipzi-render", "dep:zipzi-observe-backend"]
wgpu-backend = ["gpu", "zipzi-observe-backend/wgpu-backend"]

[dependencies]
zipzi-contract.workspace = true
zipzi-animation = { version = "=0.1.0-alpha.4", path = "../zipzi-animation" }
zipzi-core = { version = "=0.1.0-alpha.4", path = "../zipzi-core" }
zipzi-sdk = { version = "=0.1.0-alpha.4", path = "../zipzi-sdk" }
zipzi-project = { version = "=0.1.0-alpha.4", path = "../zipzi-project" }
zipzi-render = { version = "=0.1.0-alpha.4", path = "../zipzi-render", optional = true }
zipzi-observe-backend = { version = "=0.1.0-alpha.4", path = "../zipzi-observe-backend", optional = true }
png = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "capture"
required-features = ["gpu"]

[[example]]
name = "animation_gpu_frame"
required-features = ["gpu"]
