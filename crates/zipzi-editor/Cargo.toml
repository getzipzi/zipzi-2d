[package]
name = "zipzi-editor"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
# Distributed with its assets, workspace patches and licenses in the workspace source archive.
publish = false

[features]
wgpu-backend = ["zipzi-editor-render/wgpu-backend", "zipzi-runtime/wgpu-backend"]
debug-tools = ["dep:gpui-fps"]
test-support = ["gpui-kit/test-support", "dep:tempfile", "image/png"]
bench-instrumentation = ["zipzi-editor-core/bench-instrumentation", "zipzi-editor-render/bench-instrumentation"]

[dependencies]
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit.workspace = true
gpui-fps = { workspace = true, optional = true }
zipzi-editor-core.workspace = true
zipzi-sdk.workspace = true
zipzi-runtime = { workspace = true, features = ["gpu-observation"] }
zipzi-core.workspace = true
zipzi-editor-render.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
anyhow.workspace = true
async-channel.workspace = true
image = { version = "0.25.10", default-features = false }
tempfile = { workspace = true, optional = true }

[[bin]]
name = "zipzi-editor"
path = "src/main.rs"
test = false

[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true
objc2.workspace = true
libc = "0.2"

[dev-dependencies]
zipzi-sdk-observe = { version = "=0.1.0-alpha.1", path = "../zipzi-sdk-observe" }
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-apple = { package = "gpui-fast-apple", version = "=0.1.7", features = ["test-support"] }
zipzi-core.workspace = true
tempfile.workspace = true
uuid.workspace = true
toml = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[[test]]
name = "headless_screenshot"
path = "tests/headless_screenshot.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "animation_acceptance"
path = "tests/animation_acceptance.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "timeline_acceptance"
path = "tests/timeline_acceptance.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "native_render"
path = "tests/native_render.rs"
required-features = ["test-support"]

[[test]]
name = "runtime_interaction_acceptance"
path = "tests/runtime_interaction_acceptance.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "runtime_ipc_acceptance"
path = "tests/runtime_ipc_acceptance.rs"
harness = false
required-features = ["test-support"]

[[test]]
name = "runtime_handoff_acceptance"
path = "tests/runtime_handoff_acceptance.rs"
harness = false
required-features = ["test-support"]
