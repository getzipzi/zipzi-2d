[package]
name = "kasane-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core document model, geometry, deformers and evaluation for Kasane 2D"

[features]
# Synchronous, thread-local spans for opt-in editor editing benchmarks.
bench-instrumentation = []

[dependencies]
uuid = { version = "1", features = ["v4"] }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bench]]
name = "eval_benchmark"
harness = false

[[bench]]
name = "production_scale_benchmark"
harness = false
