[workspace]
members = ["crates/editor", "crates/editor-core", "crates/editor-render", "crates/component-playground"]
resolver = "3"
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-macos", "vendor/gpui-pre-apple"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
metal = "0.33"
objc2 = "0.6"
kasane-render-metal = { path = "../kasane-2d/modules/kasane-render-metal" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "5059de47a6560fdbe24e32cd91b45d6aa6849695" }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "5059de47a6560fdbe24e32cd91b45d6aa6849695" }
async-channel = "2"
kasane-core = { path = "../kasane-2d/modules/kasane-core" }
kasane-sdk = { path = "../kasane-2d/modules/kasane-sdk" }
kasane-project = { path = "../kasane-2d/modules/kasane-project" }
kasane-render = { path = "../kasane-2d/modules/kasane-render" }
editor-core = { path = "crates/editor-core" }
editor-render = { path = "crates/editor-render" }
rust-i18n = "4.2"
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = true

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
