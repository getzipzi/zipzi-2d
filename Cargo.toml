[workspace]
resolver = "3"
members = [
    "crates/zipzi-api-derive",
    "crates/zipzi-core",
    "crates/zipzi-live2d",
    "crates/zipzi-animation",
    "crates/zipzi-render",
    "crates/zipzi-render-wgpu",
    "crates/zipzi-render-metal",
    "crates/zipzi-moc3",
    "crates/zipzi-cmo3",
    "crates/zipzi-moc3-psd",
    "crates/zipzi-psd",
    "crates/zipzi-project",
    "crates/zipzi-sdk",
    "crates/zipzi-runtime",
    "crates/zipzi-observe",
    "crates/zipzi-python2",
    "crates/cubism-matrix-zipzi",
    "crates/zipzi-editor",
    "crates/zipzi-editor-core",
    "crates/zipzi-editor-render",
]

default-members = ["crates/zipzi-core", "crates/zipzi-project", "crates/zipzi-sdk"]
exclude = ["vendor/gpui-fast", "vendor/gpui-fast-macos", "vendor/gpui-fast-apple", "vendor/gpui-fast-windows", "vendor/gpui-kit"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Zipzi 2D Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
sha2 = "0.11"
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "29"

anyhow = "1"
metal = "0.33"
objc2 = "0.6"
zipzi-render-metal = { version = "=0.1.0-alpha.1", path = "crates/zipzi-render-metal" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
async-channel = "2"
zipzi-core = { version = "=0.1.0-alpha.1", path = "crates/zipzi-core" }
zipzi-sdk = { version = "=0.1.0-alpha.1", path = "crates/zipzi-sdk" }
zipzi-runtime = { version = "=0.1.0-alpha.1", path = "crates/zipzi-runtime" }
zipzi-project = { version = "=0.1.0-alpha.1", path = "crates/zipzi-project" }
zipzi-render = { version = "=0.1.0-alpha.1", path = "crates/zipzi-render" }
zipzi-editor-core = { version = "=0.1.0-alpha.1", path = "crates/zipzi-editor-core" }
zipzi-editor-render = { version = "=0.1.0-alpha.1", path = "crates/zipzi-editor-render" }
rust-i18n = "4.2"
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

# Some macOS 27 toolchains produce an unloadable cdylib when release stripping
# uses an external llvm-objcopy without the Mach-O LINKEDIT alignment fix.
[profile.release.package.zipzi-python2]
strip = "none"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

# Keep SDK packages unoptimized for fast edit-compile cycles.
# Other workspace members retain the default opt-level = 0.
[profile.dev.package.zipzi-core]
opt-level = 0

[profile.dev.package.zipzi-sdk]
opt-level = 0

[profile.dev.package.zipzi-observe]
opt-level = 0

[profile.dev.package.zipzi-project]
opt-level = 0

[profile.dev.package.zipzi-render]
opt-level = 0

[profile.dev.package.zipzi-render-metal]
opt-level = 0

[profile.dev.package.zipzi-render-wgpu]
opt-level = 0

[profile.dev.package.zipzi-animation]
opt-level = 0

[profile.dev.package.zipzi-live2d]
opt-level = 0

[profile.dev.package.zipzi-moc3]
opt-level = 0

[profile.dev.package.zipzi-cmo3]
opt-level = 0

[profile.dev.package.zipzi-psd]
opt-level = 0

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-component = { path = "vendor/gpui-kit/crates/component" }
