[workspace]
resolver = "3"
members = [
    "modules/kasane-core",
    "modules/kasane-live2d",
    "modules/kasane-animation",
    "modules/kasane-render",
    "modules/kasane-render-wgpu",
    "modules/kasane-render-metal",
    "modules/kasane-moc3",
    "modules/kasane-cmo3",
    "modules/kasane-moc3-psd",
    "modules/kasane-psd",
    "modules/kasane-project",
    "modules/kasane-sdk",
    "modules/kasane-sdk-observe",
    "modules/kasane-python",
    "benchmarks/cubism-matrix/runners/kasane",
    "apps/editor/crates/editor",
    "apps/editor/crates/editor-core",
    "apps/editor/crates/editor-render",
]

default-members = ["modules/kasane-core", "modules/kasane-project", "modules/kasane-sdk"]
exclude = ["apps/editor/vendor/gpui-fast", "apps/editor/vendor/gpui-fast-macos", "apps/editor/vendor/gpui-fast-apple", "apps/editor/vendor/gpui-kit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Kasane 2D Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
sha2 = "0.11"
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "29"

anyhow = "1"
metal = "0.33"
objc2 = "0.6"
kasane-render-metal = { path = "modules/kasane-render-metal" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
async-channel = "2"
kasane-core = { path = "modules/kasane-core" }
kasane-sdk = { path = "modules/kasane-sdk" }
kasane-project = { path = "modules/kasane-project" }
kasane-render = { path = "modules/kasane-render" }
editor-core = { path = "apps/editor/crates/editor-core" }
editor-render = { path = "apps/editor/crates/editor-render" }
rust-i18n = "4.2"
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

# Some macOS 27 toolchains produce an unloadable cdylib when release stripping
# uses an external llvm-objcopy without the Mach-O LINKEDIT alignment fix.
[profile.release.package.kasane-python]
strip = "none"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

# Keep SDK packages unoptimized for fast edit-compile cycles.
# Other workspace members retain the default opt-level = 0.
[profile.dev.package.kasane-core]
opt-level = 0

[profile.dev.package.kasane-sdk]
opt-level = 0

[profile.dev.package.kasane-sdk-observe]
opt-level = 0

[profile.dev.package.kasane-project]
opt-level = 0

[profile.dev.package.kasane-render]
opt-level = 0

[profile.dev.package.kasane-render-metal]
opt-level = 0

[profile.dev.package.kasane-render-wgpu]
opt-level = 0

[profile.dev.package.kasane-animation]
opt-level = 0

[profile.dev.package.kasane-live2d]
opt-level = 0

[profile.dev.package.kasane-moc3]
opt-level = 0

[profile.dev.package.kasane-cmo3]
opt-level = 0

[profile.dev.package.kasane-psd]
opt-level = 0

[patch.crates-io]
gpui-fast = { path = "apps/editor/vendor/gpui-fast" }
gpui-fast-macos = { path = "apps/editor/vendor/gpui-fast-macos" }
gpui-fast-apple = { path = "apps/editor/vendor/gpui-fast-apple" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-component = { path = "apps/editor/vendor/gpui-kit/crates/component" }
