[workspace]
members = ["crates/editor", "crates/editor-core", "crates/editor-render", "crates/component-playground"]
resolver = "3"
exclude = ["vendor/gpui-fast", "vendor/gpui-fast-macos", "vendor/gpui-fast-apple", "vendor/gpui-kit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
metal = "0.33"
objc2 = "0.6"
kasane-render-metal = { path = "../kasane-2d/modules/kasane-render-metal" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9", features = ["gpui-fast"] }
async-channel = "2"
kasane-core = { path = "../kasane-2d/modules/kasane-core" }
kasane-sdk = { path = "../kasane-2d/modules/kasane-sdk" }
kasane-project = { path = "../kasane-2d/modules/kasane-project" }
kasane-render = { path = "../kasane-2d/modules/kasane-render" }
editor-core = { path = "crates/editor-core" }
editor-render = { path = "crates/editor-render" }
rust-i18n = "4.2"
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = true

[profile.dev.package.gpui-fast]
opt-level = 2

[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-component = { path = "vendor/gpui-kit/crates/component" }
