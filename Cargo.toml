[workspace]
members = ["crates/editor", "crates/editor-scene", "crates/component-playground"]
resolver = "3"
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-macos", "vendor/gpui-pre-apple"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
metal = "0.33"
objc2 = "0.6"
kasane-render-metal = { path = "../kesane-2d/modules/kasane-render-metal" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "5059de47a6560fdbe24e32cd91b45d6aa6849695" }
async-channel = "2"
kasane-core = { path = "../kesane-2d/modules/kasane-core" }
kasane-render = { path = "../kesane-2d/modules/kasane-render" }
editor-scene = { path = "crates/editor-scene" }

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
