name: Prepare Python Packages
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.7'
      - name: Sync Python build tools
        run: uv sync --locked
      - name: Validate release versions
        run: uv run --locked python tools/packaging/release.py check
      - name: Build and validate installed Python distributions from source archives
        run: uv run --locked python crates/zipzi-python2/tools/distribution.py --output target/python-release
      - name: Upload packages and acceptance report
        uses: actions/upload-artifact@v7
        with:
          name: zipzi-python-packages-${{ runner.os }}
          path: |
            target/python-release/sdists/
            target/python-release/wheels/
            target/python-release/results.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
