name: Alpha release
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*-alpha.*'
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      reuse-run-id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate version before native builds
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python tools/packaging/release.py check "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Find a validated build for this exact commit
        id: reuse
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/packaging/reuse_release.py find --repository "$GITHUB_REPOSITORY" --branch "$DEFAULT_BRANCH" --revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  app:
    name: Build ${{ matrix.platform }} app
    needs: prepare
    if: needs.prepare.outputs.reuse-run-id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/alpha-app-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Restore app Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alpha-app-${{ matrix.platform }}
          workspaces: . -> target/alpha-app-cargo
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # App and Python builders use separate runners and all available CPU cores.
      - name: Build and verify macOS app
        if: matrix.platform == 'macos'
        env:
          ZIPZI_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          sh tools/build-editor-app.sh editor release
          python3 tools/packaging/verify_artifacts.py --app 'target/Zipzi Editor.app'
          codesign --force --deep --sign - 'target/Zipzi Editor.app'
          codesign --verify --deep --strict 'target/Zipzi Editor.app'
      - name: Package macOS app and source
        if: matrix.platform == 'macos'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p target/releases
          ditto -c -k --sequesterRsrc --keepParent 'target/Zipzi Editor.app' "target/releases/Zipzi-Editor-${RELEASE_TAG}-macos-arm64.zip"
          python3 tools/packaging/package_macos.py --app 'target/Zipzi Editor.app' --output "target/releases/Zipzi-Editor-${RELEASE_TAG}-macos-arm64.dmg"
          python3 tools/packaging/package_source.py "target/releases/Zipzi-2D-${RELEASE_TAG}-source.tar.gz"
          python3 tools/packaging/verify_artifacts.py --source "target/releases/Zipzi-2D-${RELEASE_TAG}-source.tar.gz"
      - name: Build Windows Editor
        if: matrix.platform == 'windows'
        run: cargo build --locked --release -p zipzi-editor
      - name: Package and verify Windows Editor
        if: matrix.platform == 'windows'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python tools/packaging/package_windows.py --binary "${env:CARGO_TARGET_DIR}/release/zipzi-editor.exe" --output "target/releases/Zipzi-Editor-${env:RELEASE_TAG}-windows-x86_64.zip" --revision "${env:GITHUB_SHA}"
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-${{ matrix.platform }}-app
          path: target/releases/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}
          compression-level: 0

  python:
    name: Build and test Python on ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.reuse-run-id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/alpha-python-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Restore Python Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alpha-python-${{ matrix.platform }}
          workspaces: . -> target/alpha-python-cargo
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Build and test Python distributions from source archives
        shell: bash
        run: uv run --locked python crates/zipzi-python2/tools/distribution.py --output target/python-release --cargo-target "$CARGO_TARGET_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-python-${{ matrix.platform }}
          path: |
            target/python-release/sdists/
            target/python-release/wheels/
            target/python-release/results.json
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}
          compression-level: 0
      - name: Upload Python build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: alpha-python-${{ matrix.platform }}-diagnostics
          path: |
            target/python-release/*.log
            target/python-release/commands.json
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: [prepare, app, python]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.reuse-run-id != '' ||
       (needs.app.result == 'success' && needs.python.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.reuse-run-id == ''
        with:
          pattern: alpha-*-app
          path: inputs/apps
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.reuse-run-id == ''
        with:
          name: alpha-python-macos
          path: inputs/python/macos
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.reuse-run-id == ''
        with:
          name: alpha-python-windows
          path: inputs/python/windows
      - name: Verify and collect tested Python distributions
        if: needs.prepare.outputs.reuse-run-id == ''
        run: python tools/packaging/collect_python.py --builds inputs/python --output dist --revision "$GITHUB_SHA"
      - name: Download previously validated release assets
        if: needs.prepare.outputs.reuse-run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: alpha-release-assets
          path: release
          run-id: ${{ needs.prepare.outputs.reuse-run-id }}
          github-token: ${{ github.token }}
      - name: Download original build manifest
        if: needs.prepare.outputs.reuse-run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: alpha-release-manifest
          path: metadata
          run-id: ${{ needs.prepare.outputs.reuse-run-id }}
          github-token: ${{ github.token }}
      - name: Verify original commit, version and publication hashes
        if: needs.prepare.outputs.reuse-run-id != ''
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir dist
          cp release/zipzi-* release/zipzi_native-* dist/
          python tools/packaging/reuse_release.py verify --manifest metadata/build.json --assets release --distributions dist --revision "$GITHUB_SHA" --tag "$RELEASE_TAG"
          (cd release && sha256sum --check SHA256SUMS)
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.7'
      - name: Validate PyPI distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - name: Assemble release assets and checksums
        if: needs.prepare.outputs.reuse-run-id == ''
        run: |
          mkdir release
          cp inputs/apps/alpha-macos-app/* inputs/apps/alpha-windows-app/* dist/* release/
          (cd release && sha256sum ./* > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Record validated build identity
        if: needs.prepare.outputs.reuse-run-id == ''
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python tools/packaging/reuse_release.py write --manifest metadata/build.json --assets release --revision "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-release-assets
          path: release/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-python-client
          path: dist/zipzi-*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-python-native
          path: dist/zipzi_native-*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-release-manifest
          path: metadata/build.json
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 7 || 1 }}

  github-release:
    if: always() && needs.collect.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: alpha-release-assets
          path: release
      - name: Verify and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Zipzi $RELEASE_TAG" --generate-notes --prerelease --latest=false

  pypi-client:
    if: always() && needs.collect.result == 'success' && needs.github-release.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [collect, github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi-zipzi
      url: https://pypi.org/project/zipzi/
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: alpha-python-client
          path: dist
      - name: Publish zipzi to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  pypi-native:
    if: always() && needs.collect.result == 'success' && needs.pypi-client.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [collect, pypi-client]
    runs-on: ubuntu-24.04
    environment:
      name: pypi-zipzi-native
      url: https://pypi.org/project/zipzi-native/
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: alpha-python-native
          path: dist
      - name: Publish zipzi-native to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
