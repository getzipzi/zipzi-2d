name: Editor CI
on:
  push:
  pull_request:

# Both domains run on all changes, including SDK, root Cargo, tools and assets.
# Narrow path filters only after dependency-aware coverage has been established.
jobs:
  editor:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.7'
          enable-cache: true
      - name: Sync Python environment
        run: uv sync --locked
      - name: Package domain coverage
        run: uv run --locked python tools/cargo_domain.py --check
      - name: Editor format
        run: uv run --locked python tools/cargo_domain.py editor fmt -- --check
      - name: Editor tooling controls
        run: uv run --locked sh tools/test-editor.sh tools
      - name: Compile every Editor target
        run: uv run --locked python tools/cargo_domain.py editor check --locked --all-targets --features kasane-editor/test-support
      - name: Core synthetic tests
        run: uv run --locked sh tools/test-editor.sh fast
      - name: Probe Metal device
        id: metal
        shell: bash
        run: |
          swift tools/metal-capability.swift >> "$GITHUB_OUTPUT"
      - name: Editor libraries and headless synthetic integration
        if: steps.metal.outputs.available == 'true'
        run: uv run --locked sh tools/test-editor.sh regression -- --nocapture
      - name: Native rendering and acceptance targets
        if: steps.metal.outputs.available == 'true'
        run: uv run --locked sh tools/test-editor.sh acceptance -- --nocapture
      - name: Record missing Metal coverage
        if: steps.metal.outputs.available != 'true'
        shell: bash
        run: |
          echo '::warning::No Metal device; Editor UI/native execution was not validated on this runner.'
          echo 'Metal unavailable: UI/native tests skipped; compile, tooling and core synthetic gates still ran. A Metal-capable runner is required for complete Editor acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Licensed model coverage
        if: always()
        shell: bash
        run: |
          echo 'Licensed models are not distributed to CI. Optional model tests report missing assets; full licensed-model acceptance remains a local P5/P6 gate.' >> "$GITHUB_STEP_SUMMARY"
