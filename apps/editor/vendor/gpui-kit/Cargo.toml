# Subset of GPUI Kit 507e82b8115ac73af92b7d3856501f9d7b73b2c9.
# Only gpui-component is built locally; sibling crates keep the pinned Git source.
[workspace]
members = ["crates/component"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
gpui-base = { version = "0.7.3", git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.9" }
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
rust-i18n = "4.2.0"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.9" }
tracing = "0.1.41"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component-macros = { version = "0.7.3", git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9" }
gpui-fast = { package = "gpui-fast", version = "0.1.7", features = ["windows-manifest-provided-by-host"] }
gpui-kit-assets = { version = "0.7.3", git = "https://github.com/longbridge/gpui-kit", rev = "507e82b8115ac73af92b7d3856501f9d7b73b2c9" }
raw-window-handle = "0.6.2"
windows = { features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"], version = "0.58.0" }

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"
